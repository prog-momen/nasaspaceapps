<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EarthTrend Explorer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body class="view-chat">
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true">🌍</span><div><b>EarthTrend Explorer</b><small id="subtitle"></small></div></div>
  <nav class="tabs" aria-label="view"><button type="button" id="tab-chat" class="tab on"></button><button type="button" id="tab-results" class="tab"></button></nav>
  <div class="top-actions">
    <label class="inline"><span id="lbl-ui-lang"></span><select id="ui-lang"><option value="ar">العربية</option><option value="en">English</option></select></label>
    <button id="btn-new" class="btn" type="button"></button>
  </div>
</header>
<main class="layout">
  <section class="chat-col" id="chat-col" aria-label="chat">
    <div class="chat-box">
      <div id="banner" class="banner" hidden></div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div class="dock">
        <div id="examples" class="examples"></div>
        <form id="composer" class="composer" autocomplete="off">
          <textarea id="input" rows="2" maxlength="1500" required dir="auto"></textarea>
          <button id="btn-send" class="btn primary" type="submit"></button>
        </form>
      </div>
    </div>
  </section>
  <aside class="side-col" id="side-col" aria-label="results">
    <section id="results" class="results" aria-live="polite"></section>
    <details class="panel" id="settings"><summary id="sum-settings"></summary>
      <p class="hint" id="settings-hint"></p>
      <div class="grid2">
        <label><span id="lbl-task"></span><select id="c-task"></select></label>
        <label><span id="lbl-variable"></span><select id="c-variable"></select></label>
        <label><span id="lbl-start"></span><input type="date" id="c-start"></label>
        <label><span id="lbl-end"></span><input type="date" id="c-end"></label>
        <label><span>lat</span><input type="number" id="c-lat" step="0.0001" min="-90" max="90"></label>
        <label><span>lon</span><input type="number" id="c-lon" step="0.0001" min="-180" max="180"></label>
      </div>
      <div class="row">
        <button type="button" id="btn-pick" class="btn small"></button>
        <button type="button" id="btn-box" class="btn small"></button>
        <button type="button" id="btn-clear-loc" class="btn small"></button>
      </div>
      <div id="loc-info" class="hint"></div>
      <details class="adv"><summary id="sum-adv"></summary>
        <label><span id="lbl-provider"></span><select id="c-provider"><option value="auto">auto</option><option value="cmr">NASA CMR</option><option value="gee">Earth Engine catalog</option></select></label>
        <label><span id="lbl-mode"></span><select id="c-mode"><option value="auto">auto</option><option value="template">template only (no model request)</option></select></label>
        <label><span id="lbl-gibs"></span><select id="c-gibs"><option value="">—</option></select></label>
        <label><span id="lbl-gibs-date"></span><input type="date" id="c-gibs-date"></label>
        <button type="button" id="btn-direct" class="btn small"></button>
      </details>
    </details>
    <details class="panel" id="diag"><summary id="sum-diag"></summary><div id="diag-body" class="diag-body"></div></details>
  </aside>
</main>
<div id="modal" class="modal" hidden><div class="modal-card"><button class="btn small" id="modal-close" type="button" aria-label="close">×</button><div id="modal-body"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="/static/app.js"></script>
</body>
</html>
